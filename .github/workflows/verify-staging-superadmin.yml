name: Verify staging superadmin

on:
  pull_request:
    branches: [develop]
    paths: [.github/workflows/verify-staging-superadmin.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify login inside staging container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -eu
            test "$(docker inspect -f '{{.State.Running}}' igen-bni-staging)" = true
            docker exec igen-bni-staging node -e '
              (async () => {
                const email = process.env.SEED_SUPERADMIN_EMAIL;
                const password = process.env.SEED_SUPERADMIN_PASSWORD;
                if (!email || !password) throw new Error("Seed variables missing in staging container");
                const response = await fetch("http://127.0.0.1:" + process.env.PORT + "/api/v1/auth/login", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email, password }),
                  signal: AbortSignal.timeout(15000),
                });
                if (!response.ok) throw new Error("Staging login returned HTTP " + response.status);
                const body = await response.json();
                if (body.user?.email !== email || body.user?.role !== "superadmin" || body.user?.isActive !== true) {
                  throw new Error("Staging login returned an unexpected user");
                }
                console.log("Staging superadmin login verified");
              })().catch((error) => { console.error(error.message); process.exit(1); });
            '
